name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create . --platforms=android --project-name pdf_flipbook --org com.example

      - name: Install packages
        run: flutter pub get

      - name: Allow plugins to compile against SDK 36
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/compilesdk.gradle" <<'EOF'
          allprojects {
            afterEvaluate { project ->
              if (project.hasProperty('android')) {
                try {
                  project.android.compileSdk = 36
                } catch (Throwable t) {
                  project.android.compileSdkVersion(36)
                }
              }
            }
          }
          EOF

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-flipbook-apk
          path: build/app/outputs/flutter-apk/app-release.apk
